<!DOCTYPE html>
<html>
<head>
<style>

  .slider-container {
    position: relative;
    width: 600px;
    height: 300px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 8px;
}

.slider-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.5s ease-in-out;
}

.slide {
  min-width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 2rem;
  font-family: sans-serif;
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  padding: 12px;
  cursor: pointer;
  font-size: 1.2rem;
}

.prev-btn { left: 10px; }
.next-btn { right: 10px; }

.nav-btn:hover { background: rgba(0, 0, 0, 0.8); }

div.hiddenNow {
    height: 40px;
    width: 300px;
    margin: 1rem 0;
    padding: 1rem;
    font-size: 2rem;
  }


  div#until-found-box {
    color: red;
    border: 5px dotted red;
    background-color: lightgray;
  }
  #until-found-box {
    scroll-margin-top: 200px;
  }
  

</style>
</head>
<body>

  <section class="rw-section rw-flower-page" id="rw-growingFlower-page"> 
      <a href="#until-found-box">Go to hidden content</a>

      <div class="hiddenNow">I'm not hidden</div>
      <div class="hiddenNow" id="until-found-box" hidden="until-found">Hidden until found</div>
      <div class="hiddenNow">I'm not hidden, either</div>
      <button id="reset">Reset</button>
  </section>



<div class="slider-container">
  <div class="slider-track" id="sliderTrack">
    <div class="slide" style="background-color: #ff5733;">Slide 1</div>
    <div class="slide" style="background-color: #33ff57;">Slide 2</div>
    <div class="slide" style="background-color: #3357ff;">Slide 3</div>
  </div>
  
  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
</div>

<script type="text/javascript" src="slider.js"></script>

</body>
</html>
