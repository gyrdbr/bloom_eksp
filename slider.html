<!DOCTYPE html>
<html>
<head>

<style>
  .slider-container {
  position: relative;
  width: 600px;
  height: 300px;
  margin: 0 auto;
  overflow: hidden;
  border-radius: 8px;
}

.slider-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.5s ease-in-out;
}

.slide {
  min-width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 2rem;
  font-family: sans-serif;
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  padding: 12px;
  cursor: pointer;
  font-size: 1.2rem;
}

.prev-btn { left: 10px; }
.next-btn { right: 10px; }

.nav-btn:hover { background: rgba(0, 0, 0, 0.8); }
</style>
</head>
<body>



<div class="slider-container">
  <div class="slider-track" id="sliderTrack">
    <div class="slide" style="background-color: #ff5733;">Slide 1</div>
    <div class="slide" style="background-color: #33ff57;">Slide 2</div>
    <div class="slide" style="background-color: #3357ff;">Slide 3</div>
  </div>
  
  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
</div>

<script type="text/javascript" src="slider.js"></script>

</body>
</html>
