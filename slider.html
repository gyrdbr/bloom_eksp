<!DOCTYPE html>
<html>
<head>

  <title>Simple growing flowers animations</title>
  <link rel="stylesheet" href="css/bloomSimplified.css">

  <style>

  body {
    margin-top: 100px;
  }

  
  .slider-track {
    margin-bottom: 25px; 
    margin-top: 25px;
    margin-left: 5px
  }

  .slider-track.dist {
     margin: 10px;
  }

  .dist {
    margin-top: 20px;
    margin-right: 20px;
  }


  .slider-container2,
  .slider-container {
    position: relative;
    width: 600px;
    height: 300px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 8px;
    margin-top: 100px;
}

.slider-track2,
.slider-track {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.5s ease-in-out;
}

.slide2,
.slide {
  min-width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 2rem;
  font-family: sans-serif;
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  padding: 12px;
  cursor: pointer;
  font-size: 1.2rem;
}

.prev-btn { left: 10px; }
.next-btn { right: 10px; }

.nav-btn:hover { background: rgba(0, 0, 0, 0.8); }

</style>
</head>
<body>

<main>

<div class="slider-container">
  <div class="slider-track" id="sliderTrack">
    <div class="slide" style="background-color: #ff5733;">Slide 1</div>
    <div class="slide" style="background-color: #33ff57;">Slide 2</div>
    <div class="slide" style="background-color: #3357ff;">Slide 3</div>
  </div>
  
  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
</div>


<div class="slider-container2">
  <div class="slider-track2" id="sliderTrack2">
    <div class="slide2" style="background-color: pink;">Slide 1</div>
    <div class="slide2" style="background-color: #e69138;">Slide 2</div>
    <div class="slide2" style="background-color: #6fa8dc;">Slide 3</div>
  </div>
  
  <button class="nav-btn prev-btn" id="prevBtn2">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn2">&#10095;</button>
</div>

</main>


<script type="text/javascript" src="slider.js"></script>


</body>
</html>
