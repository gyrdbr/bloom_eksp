<!DOCTYPE html>
<html>
<head>

   <title>Simple growing flowers animations</title>
   <link rel="stylesheet" href="css/bloomSimplified.css">
   <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
   <script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/DrawSVGPlugin3.min.js'></script>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

section {
  background-color: lightblue;
  border: 1px solid black;
  padding: 20px;
  margin-top: 60px;
  height: 1000px;
  overflow-y: scroll;
  scroll-behavior: smooth;
}


</style>

</head>

<body>

<h1>The Window Object</h1>
<h2>The scrollX and scrollY Properties</h2>

<button onclick="myFunction()" style="position:fixed; background-color: #8e7cc3;">Click me to scroll</button><br><br>

<div>
  <button class="scroll">scroll() to 1000</button>
  <button class="scroll-to">scrollTo() top</button>
  <button class="scroll-by">scrollBy() 200</button>
  <button class="scroll-into-view">Scroll last &lt;p&gt; into view</button>
</div>

<main>

    <header class="rw-page-header" id="rw-page-header">
        <div class="rw-group">
            <div class="rw-group rw-group--v">
                <h1 class="rw-page-header__title rw-group--priority">Bloom</h1>
            </div>
        </div>
    </header>

   <div id="header-placeholder"></div>

   <div class="gear-icon" id="gear-icon">
      <button class="gear-btn" id="help-button-svg">
      </button>        
   </div>

   <section>Hei</section>

</main>

<script>
function myFunction() {
  window.scrollBy(100, 100);
  // alert("pageXOffset: " + window.scrollX + ", scrollY: " + window.scrollY);
}
</script>

</body>
</html>
